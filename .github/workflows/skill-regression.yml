name: Liner Hanger Skill - Python Regression

on:
  push:
    branches: [main]
    paths:
      - 'skills/liner-hanger-rca/**'
      - '.github/workflows/skill-regression.yml'
  pull_request:
    paths:
      - 'skills/liner-hanger-rca/**'
      - '.github/workflows/skill-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-tests:
    name: Skill tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: skills/liner-hanger-rca
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/liner-hanger-rca/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run complete skill regression (no manufactured pass)
        run: python -m pytest -rs -q tests
